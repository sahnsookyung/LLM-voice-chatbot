[project]
name = "local-voice-companion"
version = "0.1.0"
description = "Private multilingual voice companion for Apple Silicon"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "websockets>=15,<17", "numpy>=2,<3", "scipy>=1.15,<2", "psutil>=6,<8",
  "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1",
  "aiortc==1.14.0",
]

[project.optional-dependencies]
voice = ["pipecat-ai[silero]>=0.0.100,<2"]
models = ["huggingface-hub>=0.34,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/companion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

